[package]
name = "termii"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
tokio = { version = "1", features = ["full"] }
russh = "0.48"
russh-keys = "0.48"
vte = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
arboard = "3"
rfd = "0.15"
anyhow = "1"
async-trait = "0.1"
dark-light = "2"
ssh-key = "0.6"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
roxmltree = "0.20"
ssh2 = "0.9"
zeroize = "1"
subtle = "2"
